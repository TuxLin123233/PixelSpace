<!DOCTYPE html>
<html lang="zh-hans">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光域画板</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(160deg, #fdf8f2 0%, #f2ece2 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 16px 40px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #3b342c;
        margin: 8px 0 16px;
        letter-spacing: 1px;
      }

      .board-wrap {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(80, 60, 40, 0.15);
        padding: 12px;
      }

      #board {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        touch-action: none;
        cursor: crosshair;
        background: #fff;
      }

      .tools {
        width: 100%;
        max-width: 460px;
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      .tool {
        flex: 1;
        height: 46px;
        border-radius: 999px;
        background: #fff;
        color: #6b5f50;
        font-size: 15px;
        font-weight: 600;
        transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
      }

      .tool.active {
        background: #3b342c;
        color: #fff;
      }

      .pick-wrap {
        width: 100%;
        max-width: 460px;
        margin-top: 14px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 6px 20px rgba(80, 60, 40, 0.10);
        padding: 16px;
        display: grid;
        grid-template-columns: 1fr 28px;
        gap: 12px;
        align-items: stretch;
      }

      .sv-box {
        position: relative;
        aspect-ratio: 1;
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
      }

      .hue-box {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
        cursor: pointer;
      }

      #svCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
      #svMarker { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
      #hueCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hueMarker { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

      .cur {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        font-size: 15px;
        color: #3b342c;
        font-weight: 600;
      }

      .records {
        width: 100%;
        max-width: 460px;
        margin-top: 14px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 6px 20px rgba(80, 60, 40, 0.10);
        padding: 16px;
      }

      .records-title {
        font-size: 14px;
        font-weight: 600;
        color: #9a8c7a;
        margin-bottom: 10px;
      }

      .record-list {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .record-list::-webkit-scrollbar { display: none; }

      .tile {
        flex: 0 0 auto;
        width: 64px;
        padding: 0;
        background: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .thumb {
        width: 56px;
        height: 56px;
        image-rendering: pixelated;
        border-radius: 8px;
        border: 2px solid rgba(0, 0, 0, 0.08);
        background: #fff;
      }

      .tile-meta {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 12px;
        color: #6b5f50;
        line-height: 1.3;
        max-width: 64px;
        word-break: break-all;
        text-align: center;
      }

      .tile-time {
        font-size: 10px;
        color: #b0a697;
      }

      .record-empty {
        font-size: 13px;
        color: #b0a697;
        padding: 8px 2px;
      }

      .name-row {
        width: 100%;
        max-width: 460px;
        margin-top: 14px;
      }

      .name-row input {
        width: 100%;
        height: 46px;
        border-radius: 14px;
        border: 2px solid #e0d8d0;
        padding: 0 14px;
        font-size: 15px;
        background: #fff;
        outline: none;
        color: #3b342c;
      }

      .name-row input:focus { border-color: #5b8def; }

      .cur-swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.1);
        background: #e53935;
      }

      #curHex { letter-spacing: 0.5px; }

      .actions {
        width: 100%;
        max-width: 460px;
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }

      .actions button {
        flex: 1;
        height: 52px;
        border-radius: 16px;
        font-size: 17px;
        font-weight: 600;
        transition: transform 0.12s ease, opacity 0.15s ease;
      }

      #clearBtn {
        background: #efe9e0;
        color: #6b5f50;
      }

      #uploadBtn {
        background: #5b8def;
        color: #fff;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translate(-50%, 16px);
        background: #3b342c;
        color: #fff;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 15px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        max-width: 86vw;
        text-align: center;
      }

      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      .hint {
        margin-top: 12px;
        font-size: 13px;
        color: #9a8c7a;
        text-align: center;
        min-height: 18px;
      }

      button:active { transform: scale(0.96); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <h1>光域画板</h1>

    <div class="board-wrap">
      <canvas id="board" width="512" height="512"></canvas>
    </div>

    <div class="tools">
      <button id="toolBrush" class="tool active" type="button" data-tool="brush">画笔</button>
      <button id="toolEraser" class="tool" type="button" data-tool="eraser">橡皮擦</button>
      <button id="toolFill" class="tool" type="button" data-tool="fill">颜料桶</button>
    </div>

    <div class="pick-wrap">
      <div class="sv-box" id="svBox">
        <canvas id="svCanvas"></canvas>
        <canvas id="svMarker"></canvas>
      </div>
      <div class="hue-box" id="hueBox">
        <canvas id="hueCanvas"></canvas>
        <canvas id="hueMarker"></canvas>
      </div>
    </div>

    <div class="cur">
      <span class="cur-swatch" id="curSwatch"></span>
      <span id="curHex">#e53935</span>
    </div>

    <div class="records">
      <div class="records-title">历史记录（最多 10 条）</div>
      <div id="recordList" class="record-list"></div>
    </div>

    <div class="name-row">
      <input id="nameInput" type="text" placeholder="你的名字（上传时绑定到作品）" maxlength="20">
    </div>

    <div class="actions">
      <button id="clearBtn" type="button">清空</button>
      <button id="uploadBtn" type="button">上传</button>
    </div>

    <div class="hint" id="hint">画笔：点按或滑动作画</div>
    <div id="toast"></div>

    <script>
      const SIZE = 16
      const TOOL_HINTS = {
        brush: '画笔：点按或滑动作画',
        eraser: '橡皮擦：点按或滑动擦除为白色',
        fill: '颜料桶：点一下区域即可填充当前颜色',
      }

      const canvas = document.getElementById('board')
      const ctx = canvas.getContext('2d')

      const dpr = window.devicePixelRatio || 1
      canvas.width = canvas.height = 512 * dpr
      ctx.scale(dpr, dpr)
      const CELL = 512 / SIZE

      let pixels = Array.from({ length: SIZE }, () =>
        Array.from({ length: SIZE }, () => [255, 255, 255])
      )
      let currentColor = [229, 57, 53]
      let activeTool = 'brush'

      const hint = document.getElementById('hint')
      const curSwatch = document.getElementById('curSwatch')
      const curHex = document.getElementById('curHex')

      /* ---------- 颜色拾取器 ---------- */
      const svBox = document.getElementById('svBox')
      const svCanvas = document.getElementById('svCanvas')
      const svMarker = document.getElementById('svMarker')
      const hueBox = document.getElementById('hueBox')
      const hueCanvas = document.getElementById('hueCanvas')
      const hueMarker = document.getElementById('hueMarker')
      const ctxSv = svCanvas.getContext('2d')
      const ctxSvM = svMarker.getContext('2d')
      const ctxHue = hueCanvas.getContext('2d')
      const ctxHueM = hueMarker.getContext('2d')

      let H = 0, S = 0.77, V = 0.9
      let SW = 0, SH = 0, HW = 0, HH = 0

      function hsvToRgb(h, s, v) {
        const i = Math.floor(h * 6)
        const f = h * 6 - i
        const p = v * (1 - s)
        const q = v * (1 - f * s)
        const t = v * (1 - (1 - f) * s)
        const rr = Math.round([v, q, p, p, t, v][i % 6] * 255)
        const gg = Math.round([t, v, v, q, p, p][i % 6] * 255)
        const bb = Math.round([p, p, t, v, v, q][i % 6] * 255)
        return [rr, gg, bb]
      }

      function resizePicker() {
        const sRect = svBox.getBoundingClientRect()
        SW = Math.max(20, Math.round(sRect.width * dpr))
        SH = SW
        svCanvas.width = svCanvas.height = SW
        svMarker.width = svMarker.height = SW

        const hRect = hueBox.getBoundingClientRect()
        HW = Math.max(10, Math.round(hRect.width * dpr))
        HH = Math.max(20, Math.round(hRect.height * dpr))
        hueCanvas.width = HW
        hueCanvas.height = HH
        hueMarker.width = HW
        hueMarker.height = HH

        renderSV()
        renderHue()
        drawSVMarker()
        drawHueMarker()
      }

      function renderSV() {
        const img = ctxSv.createImageData(SW, SH)
        const d = img.data
        for (let y = 0; y < SH; y++) {
          const v = 1 - y / (SH - 1)
          for (let x = 0; x < SW; x++) {
            const s = x / (SW - 1)
            const [r, g, b] = hsvToRgb(H, s, v)
            const i = (y * SW + x) * 4
            d[i] = r
            d[i + 1] = g
            d[i + 2] = b
            d[i + 3] = 255
          }
        }
        ctxSv.putImageData(img, 0, 0)
      }

      function renderHue() {
        for (let y = 0; y < HH; y++) {
          const hue = y / (HH - 1)
          const [r, g, b] = hsvToRgb(hue, 1, 1)
          ctxHue.fillStyle = `rgb(${r}, ${g}, ${b})`
          ctxHue.fillRect(0, y, HW, 1)
        }
      }

      function drawSVMarker() {
        ctxSvM.clearRect(0, 0, SW, SH)
        const x = S * SW
        const y = (1 - V) * SH
        ctxSvM.beginPath()
        ctxSvM.arc(x, y, 8 * dpr, 0, 2 * Math.PI)
        ctxSvM.fillStyle = '#fff'
        ctxSvM.fill()
        ctxSvM.lineWidth = 2 * dpr
        ctxSvM.strokeStyle = 'rgba(0, 0, 0, 0.7)'
        ctxSvM.stroke()
      }

      function drawHueMarker() {
        ctxHueM.clearRect(0, 0, HW, HH)
        const y = H * HH
        ctxHueM.fillStyle = '#fff'
        ctxHueM.fillRect(0, y - 3 * dpr, HW, 6 * dpr)
        ctxHueM.strokeStyle = 'rgba(0, 0, 0, 0.7)'
        ctxHueM.lineWidth = 1.5 * dpr
        ctxHueM.beginPath()
        ctxHueM.moveTo(0, y)
        ctxHueM.lineTo(HW, y)
        ctxHueM.stroke()
      }

      function applyColor() {
        currentColor = hsvToRgb(H, S, V)
        curSwatch.style.background = `rgb(${currentColor[0]}, ${currentColor[1]}, ${currentColor[2]})`
        curHex.textContent = '#' + currentColor.map((c) => c.toString(16).padStart(2, '0')).join('')
      }

      let svDrag = false
      let hueDrag = false

      function svPos(e) {
        const rect = svCanvas.getBoundingClientRect()
        const s = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width))
        const v = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height))
        return [s, v]
      }

      function setSV(e) {
        ;[S, V] = svPos(e)
        drawSVMarker()
        applyColor()
      }

      svCanvas.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        svDrag = true
        svCanvas.setPointerCapture(e.pointerId)
        setSV(e)
      })
      svCanvas.addEventListener('pointermove', (e) => {
        if (svDrag) setSV(e)
      })
      svCanvas.addEventListener('pointerup', () => (svDrag = false))
      svCanvas.addEventListener('pointercancel', () => (svDrag = false))

      function setHue(e) {
        const rect = hueCanvas.getBoundingClientRect()
        H = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height))
        renderSV()
        drawHueMarker()
        applyColor()
      }

      hueCanvas.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        hueDrag = true
        hueCanvas.setPointerCapture(e.pointerId)
        setHue(e)
      })
      hueCanvas.addEventListener('pointermove', (e) => {
        if (hueDrag) setHue(e)
      })
      hueCanvas.addEventListener('pointerup', () => (hueDrag = false))
      hueCanvas.addEventListener('pointercancel', () => (hueDrag = false))

      window.addEventListener('resize', resizePicker)

      /* ---------- 画板 ---------- */
      document.querySelectorAll('.tool').forEach((btn) => {
        btn.addEventListener('click', () => setTool(btn.dataset.tool))
      })

      function setTool(tool) {
        activeTool = tool
        document.querySelectorAll('.tool').forEach((b) =>
          b.classList.toggle('active', b.dataset.tool === tool)
        )
        hint.textContent = TOOL_HINTS[tool]
      }

      function drawGrid() {
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.10)'
        ctx.lineWidth = 1
        for (let i = 0; i <= SIZE; i++) {
          const p = i * CELL + 0.5
          ctx.beginPath()
          ctx.moveTo(p, 0)
          ctx.lineTo(p, 512)
          ctx.stroke()
          ctx.beginPath()
          ctx.moveTo(0, p)
          ctx.lineTo(512, p)
          ctx.stroke()
        }
      }

      function redraw() {
        ctx.clearRect(0, 0, 512, 512)
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            const [r, g, b] = pixels[y][x]
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`
            ctx.fillRect(x * CELL, y * CELL, CELL, CELL)
          }
        }
        drawGrid()
      }

      function cellFromEvent(e) {
        const rect = canvas.getBoundingClientRect()
        const col = Math.floor(((e.clientX - rect.left) / rect.width) * SIZE)
        const row = Math.floor(((e.clientY - rect.top) / rect.height) * SIZE)
        return { row: Math.max(0, Math.min(SIZE - 1, row)), col: Math.max(0, Math.min(SIZE - 1, col)) }
      }

      function sameColor(a, b) {
        return a[0] === b[0] && a[1] === b[1] && a[2] === b[2]
      }

      function floodFill(row, col) {
        const target = pixels[row][col]
        if (sameColor(target, currentColor)) return
        const stack = [[row, col]]
        while (stack.length) {
          const [r, c] = stack.pop()
          if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) continue
          const px = pixels[r][c]
          if (!sameColor(px, target)) continue
          pixels[r][c] = currentColor.slice()
          stack.push([r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1])
        }
        redraw()
      }

      function paint(e) {
        const { row, col } = cellFromEvent(e)
        if (activeTool === 'fill') {
          floodFill(row, col)
          return
        }
        const color = activeTool === 'eraser' ? [255, 255, 255] : currentColor
        pixels[row][col] = color.slice()
        redraw()
      }

      let painting = false
      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        painting = true
        canvas.setPointerCapture(e.pointerId)
        paint(e)
      })
      canvas.addEventListener('pointermove', (e) => {
        if (painting && activeTool !== 'fill') paint(e)
      })
      const stop = () => (painting = false)
      canvas.addEventListener('pointerup', stop)
      canvas.addEventListener('pointercancel', stop)

      document.getElementById('clearBtn').addEventListener('click', () => {
        pixels = Array.from({ length: SIZE }, () =>
          Array.from({ length: SIZE }, () => [255, 255, 255])
        )
        redraw()
        toast('已清空')
      })

      const uploadBtn = document.getElementById('uploadBtn')
      uploadBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim()
        if (!name) {
          toast('请先填写你的名字')
          return
        }

        const flat = []
        for (const row of pixels) for (const px of row) flat.push([px[0], px[1], px[2]])

        uploadBtn.disabled = true
        try {
          const res = await fetch('/api/set', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pixels: flat, name }),
          })
          const data = await res.json().catch(() => ({}))
          if (res.ok) {
            toast('上传成功：' + data.name)
            fetchRecords()
          } else {
            toast('上传失败：' + (data.error || res.status))
          }
        } catch (err) {
          toast('上传失败：网络错误')
        } finally {
          uploadBtn.disabled = false
        }
      })

      /* ---------- 名字与历史记录 ---------- */
      const nameInput = document.getElementById('nameInput')

      function readCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + encodeURIComponent(name) + '=([^;]*)'))
        return match ? decodeURIComponent(match[1]) : ''
      }

      function initName() {
        const saved = localStorage.getItem('paintName')
        const cookieUser = readCookie('username')
        nameInput.value = saved || cookieUser || ''
        nameInput.addEventListener('input', () => {
          localStorage.setItem('paintName', nameInput.value.trim())
        })
      }

      function formatTime(ts) {
        if (!ts) return ''
        const d = new Date(ts)
        return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
      }

      const recordList = document.getElementById('recordList')

      async function fetchRecords() {
        try {
          const res = await fetch('/api/get')
          if (!res.ok) return
          const data = await res.json()
          renderRecords(data.history || [])
        } catch (err) {
          /* 忽略加载失败 */
        }
      }

      function renderRecords(records) {
        recordList.innerHTML = ''
        if (!records.length) {
          const empty = document.createElement('div')
          empty.className = 'record-empty'
          empty.textContent = '还没有人上传过作品'
          recordList.appendChild(empty)
          return
        }
        records.forEach((rec) => {
          const tile = document.createElement('button')
          tile.type = 'button'
          tile.className = 'tile'
          tile.title = '点击载入画板'

          const c = document.createElement('canvas')
          c.width = 16
          c.height = 16
          c.className = 'thumb'
          const tc = c.getContext('2d')
          for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
              const px = rec.pixels[y * 16 + x]
              if (!px) continue
              tc.fillStyle = `rgb(${px[0]}, ${px[1]}, ${px[2]})`
              tc.fillRect(x, y, 1, 1)
            }
          }

          const meta = document.createElement('div')
          meta.className = 'tile-meta'
          const nm = document.createElement('span')
          nm.textContent = rec.name || '匿名'
          const tm = document.createElement('span')
          tm.className = 'tile-time'
          tm.textContent = formatTime(rec.time)
          meta.append(nm, tm)

          tile.append(c, meta)
          tile.addEventListener('click', () => loadRecord(rec))
          recordList.appendChild(tile)
        })
      }

      function loadRecord(rec) {
        const flat = rec.pixels
        pixels = Array.from({ length: SIZE }, (_, y) =>
          Array.from({ length: SIZE }, (_, x) => {
            const px = flat[y * SIZE + x]
            return px ? [px[0], px[1], px[2]] : [255, 255, 255]
          })
        )
        redraw()
        toast('已载入「' + (rec.name || '匿名') + '」的作品')
      }

      let toastTimer
      function toast(msg) {
        const el = document.getElementById('toast')
        el.textContent = msg
        el.classList.add('show')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => el.classList.remove('show'), 2200)
      }

      redraw()
      resizePicker()
      applyColor()
      initName()
      fetchRecords()
    </script>
  </body>
</html>
